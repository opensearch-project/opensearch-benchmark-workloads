name: Validate Workloads
on:
  pull_request:
    branches: ["*"]

jobs:
  validate-workloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python3 -m pip install pandas scikit-learn

      - name: Install opensearch-benchmark
        run: pip install opensearch-benchmark

      # Load each workload from this checkout. `list workloads` would validate
      # the default repository's remote branch instead of the pull request.
      - name: Validate all workloads
        run: |
          failed=0
          for f in */workload.json; do
            dir=$(dirname "$f")
            if ! out=$(opensearch-benchmark info --workload-path="$dir" --offline 2>&1); then
              echo "::error file=$f::$(echo "$out" | grep -m1 'ERROR')"
              failed=1
            fi
          done
          exit $failed
